---
- name: Check development and production websites
  hosts: localhost
  sources:
    - ansible.eda.url_check:
        urls:
          - "{{ web_dev_url }}"
          - "{{ web_prod_url }}"
        delay: 30
  rules:
    - name: Website is up
      condition: event.url_check.status == "up"
      action:
        run_job_template:
          name: "Website Up Template"
          organization: "AAP Migration Lab"
    - name: Website is down
      condition: event.url_check.status == "down"
      action:
        run_job_template:
          name: "Website Down Template"
          organization: "AAP Migration Lab"

